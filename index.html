<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Qualification Lead</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f5;padding:16px;color:#1a1a1a}
.wrap{max-width:720px;margin:0 auto;padding-bottom:2rem}
h1{font-size:18px;font-weight:600;margin-bottom:16px;color:#1a1a1a}
.progress-bar-wrap{background:#fff;border-radius:10px;border:1px solid #e5e5e5;padding:12px 16px;margin-bottom:16px;display:flex;align-items:center;gap:14px}
.bar-bg{flex:1;height:6px;background:#ebebeb;border-radius:3px;overflow:hidden}
.bar-fill{height:100%;background:#22c55e;border-radius:3px;transition:width .3s}
.progress-txt{font-size:13px;font-weight:600;color:#444;min-width:36px;text-align:right}
.progress-label{font-size:13px;color:#888}
.reset-btn{padding:6px 12px;font-size:13px;border-radius:7px;border:1px solid #ddd;background:#fff;color:#666;cursor:pointer}
.reset-btn:hover{background:#f5f5f5}
.section{margin-bottom:14px}
.section-header{display:flex;align-items:center;gap:8px;padding:10px 14px;background:#efefef;border-radius:8px;margin-bottom:6px;cursor:pointer;user-select:none}
.section-icon{font-size:15px}
.section-title{font-size:12px;font-weight:600;color:#555;letter-spacing:.06em;text-transform:uppercase;flex:1}
.section-count{font-size:12px;color:#aaa}
.chevron{font-size:13px;color:#aaa;transition:transform .2s;display:inline-block}
.chevron.open{transform:rotate(180deg)}
.fields{display:flex;flex-direction:column;gap:4px}
.field-card{border-radius:8px;border:1px solid #e5e5e5;background:#fff;overflow:hidden;transition:border-color .15s}
.field-card.checked{border-color:#86efac;background:#f0fdf4}
.field-top{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;cursor:pointer}
.checkbox{width:18px;height:18px;border-radius:4px;border:1px solid #ccc;background:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;transition:background .15s,border-color .15s;font-size:12px}
.field-card.checked .checkbox{background:#22c55e;border-color:#16a34a;color:#fff}
.field-label{font-size:14px;color:#1a1a1a;line-height:1.4;flex:1;font-weight:500}
.field-card.checked .field-label{color:#666;text-decoration:line-through;text-decoration-color:#86efac}
.tag{font-size:11px;padding:2px 7px;border-radius:999px;background:#fee2e2;color:#dc2626;margin-left:6px;font-weight:500}
.note-area{padding:0 12px 10px 40px;display:flex;flex-direction:column;gap:8px}
.dual-inputs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.input-group label{font-size:12px;color:#888;display:block;margin-bottom:4px}
textarea,input[type=text]{width:100%;font-size:13px;color:#1a1a1a;background:#f9f9f9;border:1px solid #e5e5e5;border-radius:7px;padding:7px 10px;font-family:inherit;line-height:1.5;transition:border-color .15s}
textarea{resize:vertical;min-height:54px}
input[type=text]{height:36px}
textarea:focus,input[type=text]:focus{outline:none;border-color:#94a3b8;background:#fff}
textarea::placeholder,input[type=text]::placeholder{color:#bbb}
.field-card.checked textarea,.field-card.checked input[type=text]{background:#f0fdf4;border-color:#86efac}
</style>
</head>
<body>
<div class="wrap">
  <h1>🗒 Qualification Lead</h1>
  <div class="progress-bar-wrap">
    <span class="progress-label">Progression</span>
    <div class="bar-bg"><div class="bar-fill" id="bar" style="width:0%"></div></div>
    <span class="progress-txt" id="pct">0%</span>
    <button class="reset-btn" onclick="resetAll()">↺ Réinitialiser</button>
  </div>
  <div id="checklist"></div>
</div>

<script>
const sections=[
  {
    icon:"👤",
    title:"Informations de base",
    fields:[
      {label:"Téléphone", ph:"Ex: 514-555-0123", single:true},
      {label:"Es-tu le seul décideur?", ph:"Nom des autres décideurs si applicable…"},
      {label:"Nom du responsable", ph:"Prénom et nom"},
      {label:"Nom de l'entreprise", ph:"Raison sociale"},
      {label:"Ville", ph:"Ex: Montréal, Laval…"},
    ]
  },
  {
    icon:"💬",
    title:"Contexte initial",
    fields:[
      {label:"Quel est leur besoin?", ph:"Décrire le besoin exprimé…"},
      {label:"Ont-ils déjà pensé à instaurer un service alimentaire?", ph:"Réponse et contexte…"},
      {label:"Comment fonctionne leur entreprise?", ph:"Type d'activité, fonctionnement général…"},
      {label:"Pourquoi maintenant?", ph:"Déclencheur, contexte de la démarche…"},
    ]
  },
  {
    icon:"🏪",
    title:"Profil de l'établissement",
    fields:[
      {label:"Service actuel sur place", ph:"Cafétéria, distributrice, traiteur, rien…"},
      {label:"Nombre d'employés", dual:[{sub:"Total",ph:"Ex: 120"},{sub:"Par jour",ph:"Ex: 80"}]},
      {label:"Nombre de visiteurs", dual:[{sub:"Total",ph:"Ex: 200/semaine"},{sub:"Par jour",ph:"Ex: 40"}]},
      {label:"À quoi ressemble la clientèle?", ph:"Âge, profil, habitudes…"},
      {label:"Heures d'ouverture", ph:"Ex: Lun–Ven 8h–18h"},
      {label:"Saisons fortes / mortes", ph:"Ex: achalandage élevé en hiver…"},
    ]
  },
  {
    icon:"📍",
    title:"Visite sur place",
    fields:[
      {label:"Marches, obstacles, dimensions des portes", ph:"Notes sur l'accessibilité et la logistique…"},
      {label:"Dans un monde idéal, quand aimerais-tu avoir le service?", ph:"Délai souhaité…"},
      {label:"Kit de Survie ou Service Complet?", ph:"Préférence et justification…"},
      {label:"Emplacement de la machine", ph:"Description ou croquis de l'endroit…"},
      {label:"Horaire de remplissage / fonctionnement", ph:"Fréquence, plages horaires préférées…"},
    ]
  },
  {
    icon:"📋",
    title:"Détails du contrat",
    fields:[
      {label:"Clause Cristian", ph:"Notes…", tag:"⚠ vérifier"},
      {label:"Produits interdits?", ph:"Caféine, noix, allergènes, autres restrictions…"},
      {label:"Suggestions ou demandes spécifiques du client", ph:"Produits souhaités, aménagements particuliers…"},
      {label:"Numéro de cellulaire — peut-on envoyer des textos?", ph:"Numéro + confirmation texto Oui/Non"},
      {label:"Disponibilité pour le prochain meeting (signature)", ph:"Date(s) proposée(s)…"},
    ]
  }
];

const state={};
let total=0;
sections.forEach((s,si)=>s.fields.forEach((_,fi)=>{state[si+"-"+fi]=false;total++;}));

function updateProgress(){
  const done=Object.values(state).filter(Boolean).length;
  const pct=Math.round(done/total*100);
  document.getElementById("bar").style.width=pct+"%";
  document.getElementById("pct").textContent=pct+"%";
}

function toggle(k,card){
  state[k]=!state[k];
  card.classList.toggle("checked",state[k]);
  updateProgress();
}

function resetAll(){
  Object.keys(state).forEach(k=>state[k]=false);
  document.querySelectorAll(".field-card").forEach(el=>el.classList.remove("checked"));
  document.querySelectorAll("textarea,input[type=text]").forEach(el=>el.value="");
  updateProgress();
}

const cl=document.getElementById("checklist");
sections.forEach((s,si)=>{
  const sec=document.createElement("div");
  sec.className="section";

  const hdr=document.createElement("div");
  hdr.className="section-header";
  hdr.innerHTML=`<span class="section-icon">${s.icon}</span><span class="section-title">${s.title}</span><span class="section-count">${s.fields.length} éléments</span><span class="chevron open">▾</span>`;

  const fields=document.createElement("div");
  fields.className="fields";

  hdr.addEventListener("click",()=>{
    const ch=hdr.querySelector(".chevron");
    const open=ch.classList.contains("open");
    ch.classList.toggle("open",!open);
    fields.style.display=open?"none":"flex";
  });

  s.fields.forEach((f,fi)=>{
    const k=si+"-"+fi;
    const card=document.createElement("div");
    card.className="field-card";

    const top=document.createElement("div");
    top.className="field-top";
    top.innerHTML=`<div class="checkbox" id="cb-${k}"></div><div style="flex:1"><div class="field-label">${f.label}${f.tag?`<span class="tag">${f.tag}</span>`:""}</div></div>`;
    top.addEventListener("click",()=>{
      const cb=document.getElementById("cb-"+k);
      toggle(k,card);
      cb.textContent=state[k]?"✓":"";
    });

    const noteArea=document.createElement("div");
    noteArea.className="note-area";

    if(f.dual){
      const grid=document.createElement("div");
      grid.className="dual-inputs";
      f.dual.forEach(d=>{
        const grp=document.createElement("div");
        grp.className="input-group";
        const lbl=document.createElement("label");
        lbl.textContent=d.sub;
        const inp=document.createElement("input");
        inp.type="text";
        inp.placeholder=d.ph;
        grp.appendChild(lbl);
        grp.appendChild(inp);
        grid.appendChild(grp);
      });
      noteArea.appendChild(grid);
    } else if(f.single){
      const inp=document.createElement("input");
      inp.type="text";
      inp.placeholder=f.ph||"";
      noteArea.appendChild(inp);
    } else {
      const ta=document.createElement("textarea");
      ta.placeholder=f.ph||"Notes…";
      ta.rows=2;
      noteArea.appendChild(ta);
    }

    card.appendChild(top);
    card.appendChild(noteArea);
    fields.appendChild(card);
  });

  sec.appendChild(hdr);
  sec.appendChild(fields);
  cl.appendChild(sec);
});

updateProgress();
</script>
</body>
</html>
